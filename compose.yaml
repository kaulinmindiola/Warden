# Reference environment of Warden (REQ-INST-001, SDD V21): the application with PostgreSQL, Redis,
# two simulated e-mail providers, Prometheus and Grafana, started with one command. From the
# repository root:
#
#   docker compose up -d --wait                    # Warden on http://localhost:8080
#                                                  # Grafana on http://localhost:3000
#                                                  # Prometheus on http://localhost:9090
#   docker compose --profile scale up -d --wait    # plus a second instance on http://localhost:8082
#   docker compose --profile scale down -v --remove-orphans   # removes containers, network, volumes
#
# PostgreSQL, Redis and the providers are also published on 127.0.0.1, for development with
# "spring-boot:run" and the local profile. Credentials are local-only defaults; override them in
# .env. The management port of Warden (8081) is never published. Every image is pinned by digest.
name: warden

# Shared by both Warden instances. Keys are generated by the first instance into the warden-keys
# volume and read by every instance, so tokens and sealed secrets work across them (REQ-DIST-001).
x-warden: &warden
  image: warden:local
  build:
    context: .
  environment:
    SPRING_PROFILES_ACTIVE: local
    WARDEN_DB_URL: jdbc:postgresql://postgres:5432/warden
    WARDEN_DB_APP_PASSWORD: ${WARDEN_DB_APP_PASSWORD:-warden_app_local}
    WARDEN_DB_OWNER_PASSWORD: ${WARDEN_DB_OWNER_PASSWORD:-warden_owner_local}
    WARDEN_REDIS_HOST: redis
    WARDEN_PROVIDER_PRIMARY: ${WARDEN_PROVIDER_PRIMARY:-a}
    WARDEN_PROVIDER_A_URL: http://provider-a:8080
    WARDEN_PROVIDER_B_URL: http://provider-b:8080
    WARDEN_KEYS_FILE: /var/lib/warden/keys/keys.env
  volumes:
    - warden-keys:/var/lib/warden/keys
  mem_limit: 1g
  # Longer than the 30 s graceful shutdown, so SIGKILL never cuts it short (REQ-AVAIL-002).
  stop_grace_period: 40s
  # Readiness on the management port, from inside the container (REQ-AVAIL-001).
  healthcheck:
    test:
      - CMD
      - java
      - -Xmx32m
      - -XX:TieredStopAtLevel=1
      - -cp
      - /app/BOOT-INF/classes
      - io.github.kaulinmindiola.warden.shared.tools.HealthProbe
      - http://localhost:8081/actuator/health/readiness
    interval: 10s
    timeout: 8s
    retries: 6
    start_period: 90s
    start_interval: 3s

services:
  warden:
    <<: *warden
    ports:
      - "127.0.0.1:${WARDEN_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      provider-a:
        condition: service_healthy
      provider-b:
        condition: service_healthy

  # Second instance, for the multi-instance demonstration (REQ-DIST-001). It starts once the first
  # one is ready: the schema is migrated and the keys exist.
  warden-2:
    <<: *warden
    profiles: ["scale"]
    ports:
      - "127.0.0.1:${WARDEN_2_API_PORT:-8082}:8080"
    depends_on:
      warden:
        condition: service_healthy

  postgres:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_DB: warden
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WARDEN_DB_SUPERUSER_PASSWORD:-postgres_local}
      WARDEN_DB_OWNER_PASSWORD: ${WARDEN_DB_OWNER_PASSWORD:-warden_owner_local}
      WARDEN_DB_APP_PASSWORD: ${WARDEN_DB_APP_PASSWORD:-warden_app_local}
    ports:
      - "127.0.0.1:${WARDEN_DB_PORT:-5432}:5432"
    volumes:
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d warden"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${WARDEN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Simulated e-mail providers A and B (REQ-INT-008): WireMock with the mappings of ops/providers.
  provider-a:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports:
      - "127.0.0.1:${WARDEN_PROVIDER_A_PORT:-8091}:8080"
    volumes:
      - ./ops/providers/a/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  provider-b:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports:
      - "127.0.0.1:${WARDEN_PROVIDER_B_PORT:-8092}:8080"
    volumes:
      - ./ops/providers/b/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Metrics and alerts (REQ-OBS-007, ADR-018): Prometheus scrapes the management port of every
  # Warden instance inside this network and evaluates the alert rules; there is no Alertmanager.
  prometheus:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    ports:
      - "127.0.0.1:${WARDEN_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The dashboard "Warden — Access & Delivery", provisioned at startup. Anonymous visitors can view
  # it; the local-only admin password is needed only to change Grafana itself.
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "127.0.0.1:${WARDEN_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${WARDEN_GRAFANA_ADMIN_PASSWORD:-admin_local}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/warden-access-delivery.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  pg-data:
  warden-keys: