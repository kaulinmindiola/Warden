spring:
  application:
    name: warden

  main:
    banner-mode: off

  # HTTP requests run on virtual threads; blocking resources are bounded explicitly (SDD V16).
  threads:
    virtual:
      enabled: true

  # On SIGTERM the instance stops taking requests and claiming work, and waits up to 30 s for what
  # is in progress before closing its connections (REQ-AVAIL-002, SDD V17).
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Request parameters and headers, Authorization included, are never written to the log, not even
  # at DEBUG (REQ-OBS-005, SDD V19). No request or response body is logged anywhere.
  mvc:
    log-request-details: false

  # Runtime connections use the application role. It owns no table, so Row Level Security
  # applies to it (ADR-013, SDD V06). No default password: only the local profile has one.
  # A connection that cannot be obtained within 2 s fails the request with 503 instead of making
  # it wait (SDD V17, ADR-007). Hikari takes milliseconds; validation must be shorter.
  datasource:
    url: ${WARDEN_DB_URL:jdbc:postgresql://localhost:${WARDEN_DB_PORT:5432}/warden}
    username: ${WARDEN_DB_APP_USER:warden_app}
    password: ${WARDEN_DB_APP_PASSWORD:}
    hikari:
      connection-timeout: ${WARDEN_DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: 1000

  # Migrations run at startup as the schema owner (REQ-INST-003); checksums of applied
  # migrations are validated on every start (REQ-CM-003).
  flyway:
    url: ${spring.datasource.url}
    user: ${WARDEN_DB_OWNER_USER:warden_owner}
    password: ${WARDEN_DB_OWNER_PASSWORD:}
    validate-on-migrate: true

  jpa:
    open-in-view: false

  # Commands fail after 200 ms instead of Lettuce's default 60 s, so an unavailable Redis sends
  # revocation checks to PostgreSQL at once (SDD V17, V23; ADR-007).
  data:
    redis:
      host: ${WARDEN_REDIS_HOST:localhost}
      port: ${WARDEN_REDIS_PORT:6379}
      timeout: ${WARDEN_REDIS_TIMEOUT:200ms}
      connect-timeout: ${WARDEN_REDIS_CONNECT_TIMEOUT:1s}

# Key material (REQ-INST-002, SDD V18). Never commit values: they come only from the
# environment. Only the local profile allows generating missing keys at startup.
warden:
  keys:
    jwt-signing-key: ${WARDEN_JWT_SIGNING_KEY:}
    jwt-key-id: ${WARDEN_JWT_KEY_ID:}
    secret-keys: ${WARDEN_SECRET_KEYS:}
    hmac-key: ${WARDEN_HMAC_KEY:}
    allow-ephemeral: false

  # Rate limits (SRS DEC-005, DEC-028, DEC-031; ADR-014). Each limit is a token bucket of
  # "capacity" requests refilled in full once per "window". These are the normative SRS values;
  # every one can be overridden from the environment, e.g. WARDEN_RATELIMIT_LOGINPERIP_CAPACITY.
  ratelimit:
    login-failures-per-email:
      capacity: 5
      window: 15m
    login-per-ip:
      capacity: 20
      window: 1m
    password-reset-per-email:
      capacity: 3
      window: 1h
    password-reset-per-ip:
      capacity: 10
      window: 1h
    refresh-per-ip:
      capacity: 60
      window: 1m
    verification-resend-per-account:
      capacity: 3
      window: 1h
    invitations-per-workspace:
      capacity: 50
      window: 1d
    invitations-per-inviter:
      capacity: 100
      window: 1d

  # Simulated e-mail providers (REQ-INT-008, SDD V09): WireMock instances serving the mappings of
  # ops/providers. The primary is tried first; the secondary takes over within the same attempt.
  notification:
    providers:
      primary: ${WARDEN_PROVIDER_PRIMARY:a}
      a-url: ${WARDEN_PROVIDER_A_URL:http://localhost:8091}
      b-url: ${WARDEN_PROVIDER_B_URL:http://localhost:8092}
      connect-timeout: 2s
      request-timeout: 5s
    # One breaker per provider (REQ-REL-004, ADR-009): opens when half of the last 20 calls, with a
    # minimum of 10, failed transiently; stays open 30 s; then 3 probe calls decide.
    circuit-breaker:
      sliding-window-size: 20
      minimum-calls: 10
      failure-rate-threshold: 50
      wait-in-open-state: 30s
      probe-calls: 3
    # Single-use links (REQ-INT-009, DEC-053): pages of the API consumer; the token goes only in the
    # fragment (#token=...). The defaults are the local profile values (D-05).
    links:
      verify-email: ${WARDEN_LINK_VERIFY_EMAIL_URL:http://localhost:3001/verify-email}
      reset-password: ${WARDEN_LINK_RESET_PASSWORD_URL:http://localhost:3001/reset-password}
      accept-invitation: ${WARDEN_LINK_ACCEPT_INVITATION_URL:http://localhost:3001/accept-invitation}
    # Delivery worker (SDD V14-A5): each tick leases a batch of due deliveries for 30 s and sends
    # up to 8 at a time. Waits between attempts: min(max, initial * multiplier^(n-1)) +/- jitter,
    # that is 1, 2, 4 and 8 s within +/-50 % (REQ-REL-006); the 5th failure is DEAD.
    delivery:
      concurrency: 8
      batch-size: 16
      lease: 30s
      backoff:
        initial: 1s
        multiplier: 2
        max: 60s
        jitter: 0.5

# One JSON object per log line, including traceId, spanId, userId, workspaceId and originTraceId
# from the MDC (REQ-OBS-004, 006, SDD V19). Every text value is redacted on the way out: tokens and
# e-mail addresses are masked (REQ-OBS-005).
logging:
  structured:
    format:
      console: logstash
    json:
      customizer: io.github.kaulinmindiola.warden.shared.logging.RedactingJsonMembersCustomizer

# Actuator runs on a separate port that is never published outside the deployment network.
# Readiness depends on PostgreSQL and on the application accepting traffic, never on Redis, whose
# failure is degraded (REQ-AVAIL-001, SDD V17). Liveness reports only the application state.
server:
  shutdown: graceful

management:
  server:
    port: ${WARDEN_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db