# Test classpath only: loaded in addition to the main application.yaml and takes precedence
# over it. Tests run without configured keys, so missing keys are generated in memory. The
# prod-like profile still refuses them (REQ-INST-002).

# Spring keeps every distinct test context alive, each with its own connection pool. Hikari's
# default keeps all 10 connections of a pool open while idle, so a dozen cached contexts exhaust
# PostgreSQL. Test pools keep one idle connection and close the rest after 10 s (the Hikari
# minimum); the maximum, and so the concurrency available to a test, is unchanged.
spring:
  datasource:
    hikari:
      minimum-idle: 1
      idle-timeout: 10000

warden:
  keys:
    allow-ephemeral: true
  # No background worker ticks at an unpredictable moment: tests call the workers directly.
  scheduling:
    enabled: false
  # No minimum response time, so registering accounts in every test stays fast.
  # ResponseFloorIT sets its own value and verifies the floor (ADR-019).
  security:
    response-floor: 0ms
  # Every request of the test suite comes from 127.0.0.1 (MockMvc and the RANDOM_PORT tests
  # alike), so the per-IP limits would make unrelated tests reject each other. Only their capacity
  # is raised; windows and the per-e-mail and per-account limits keep the SRS values.
  # IamRateLimitIT restores the SRS capacities in its own context (REQ-SEC-007 to REQ-SEC-009).
  ratelimit:
    login-per-ip:
      capacity: 100000
    password-reset-per-ip:
      capacity: 100000
    refresh-per-ip:
      capacity: 100000